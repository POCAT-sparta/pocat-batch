spring:
  application:
    name: pocat-batch

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  data:
    redis:
      cluster:
        nodes: ${REDIS_CLUSTER_NODES:redis-1:7001,redis-2:7002,redis-3:7003,redis-4:7004,redis-5:7005,redis-6:7006}
        max-redirects: 3
      password: ${REDIS_PASSWORD:}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false

server:
  port: ${BATCH_SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

pocat:
  main-app:
    base-url: ${POCAT_API_BASE_URL:http://localhost:8080}
    internal-token: ${POCAT_INTERNAL_TOKEN}
  batch:
    ranking:
      free:
        cache-size: 100
        ttl-seconds: 70
        popular-days: 7
        comment-weight: 3
    card-sync:
      admin-user-id: ${CARD_SYNC_ADMIN_USER_ID:1}

outbox:
  relay:
    age-threshold-seconds: ${OUTBOX_AGE_THRESHOLD_SECONDS:10}
