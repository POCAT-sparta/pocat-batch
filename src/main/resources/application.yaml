spring:
  application:
    name: pocat-batch

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false

server:
  port: ${BATCH_SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

pocat:
  batch:
    ranking:
      free:
        cache-size: 100
        ttl-seconds: 70
        popular-days: 7
        comment-weight: 3
