spring:
  application:
    name: pocat-batch
  profiles:
    default: local

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics

pocat:
  batch:
    ranking:
      free:
        cache-size: 100
        ttl-seconds: 70
        popular-days: 7
        comment-weight: 3
    card-sync:
      admin-user-id: 1

outbox:
  relay:
    age-threshold-seconds: 10
